name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # all three suites are offline: no network, no subprocesses, no git
      - run: python3 test_fetch_pollen.py
      - run: python3 test_daily.py
      - run: python3 test_viz_pollen.py
